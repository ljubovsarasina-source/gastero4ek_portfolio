<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Мета-теги для корректного отображения шрифтов и адаптива на телефонах -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastero4ek | Portfolio</title>
    
    <!-- 1. Библиотека от Google для работы с 3D (рендерит .glb файлы) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <!-- 2. Подключение внешних шрифтов Google Fonts (Cinzel, Inter, Noto Serif JP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700&family=Noto+Serif+JP:wght@500&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           01. БАЗОВЫЕ НАСТРОЙКИ СТРАНИЦЫ (RESET & BASE STYLES)
           ========================================================================== */
        * {
            box-sizing: border-box; /* Чтобы отступы не увеличивали ширину блоков */
        }

        html {
            scroll-behavior: smooth; /* Плавный скролл при клике на якоря */
        }

        body {
            margin: 0;
            background: #0a0407; /* Резервный темный цвет фона */
            color: #f7eeeb;
            font-family: "Inter", sans-serif;
            overflow-x: hidden; /* Прячет горизонтальный скроллбара от ленты */
        }

        /* ==========================================================================
           02. ИНТЕРАКТИВНЫЙ ФОН С ПАРАЛЛАКСОМ (BACKGROUND)
           ========================================================================== */
        #bg-image {
            position: fixed;
            inset: -5%; /* Небольшой запас по краям для смещения за мышкой */
            background-image: url("https://codehs.com/uploads/c7c3c8b563f035682275e9f372b3293e"); /* <-- Ссылка на фон */
            background-position: center;
            background-size: cover;
            z-index: 0;
            pointer-events: none; /* Чтобы мышь кликала сквозь фон */
            transition: transform 0.15s ease-out; /* Плавность параллакса */
            filter: brightness(0.8); /* Яркость картинки фона (0.8 = 80%) */
        }

        /* Тёмный полупрозрачный слой поверх фона для улучшения читаемости */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: rgba(15, 4, 7, 0.3);
        }

        /* Обертка для всего основного содержимого сайта */
        .page-content {
            position: relative;
            z-index: 2; /* Контент всегда выше фона */
        }

        /* ==========================================================================
           03. АНИМИРОВАННАЯ ЛЕНТА (RIBBON)
           ========================================================================== */
        .ribbon-container {
            position: absolute;
            top: 12vh; /* Высота ленты относительно верха первого экрана */
            left: -50vw;
            width: 200vw; /* Длина с запасом, чтобы перекрывала весь экран */
            height: 85px; /* Высота самой ленты */
            transform: rotate(-12deg); /* Угол наклона ленты */
            z-index: 50;
            pointer-events: none;
        }

        .ribbon-track {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Градиент ленты */
            background: linear-gradient(180deg, #5a1520 0%, #7a1a28 50%, #5a1520 100%);
            /* Пунктирные границы */
            border-top: 2px dashed rgba(255, 220, 220, 0.8);
            border-bottom: 2px dashed rgba(255, 220, 220, 0.8);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            /* Вылет ленты вдоль ее оси */
            animation: ribbonSlide 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Текст внутри ленты */
        .ribbon-jp {
            font-family: "Noto Serif JP", serif;
            font-size: 20px;
            margin-right: 15vw; /* Отступ иероглифов от ника */
            color: #f5e6d3;
        }

        .ribbon-name {
            font-family: 'Cinzel', serif;
            font-size: 46px;
            font-weight: 900;
            color: #f5e6d3;
            text-shadow: 0 0 15px rgba(255, 59, 86, 0.5); /* Свечение ника */
        }

        /* Анимация движения ленты слева направо */
        @keyframes ribbonSlide {
            from { transform: translateX(-100vw); }
            to { transform: translateX(0); }
        }

        /* ==========================================================================
           04. ПЕРВЫЙ ЭКРАН И ЛОГОТИП (HERO SECTION)
           ========================================================================== */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .site-logo {
            font-family: 'Cinzel', serif;
            font-size: clamp(40px, 8vw, 90px); /* Адаптивный размер шрифта */
            font-weight: 900;
            margin: 0;
            text-shadow: 0 0 30px rgba(255, 42, 75, 0.6); /* Красное свечение логотипа */
        }

        .site-subtitle {
            color: #ff3b56;
            font-size: 16px;
            letter-spacing: 10px; /* Межбуквенный интервал */
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* ==========================================================================
           05. ГЛАВНАЯ СЕКЦИЯ С 3D МОДЕЛЬЮ (MAIN SHOWCASE)
           ========================================================================== */
        .section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        /* Центральная карточка (изначально прозрачна для анимации скролла) */
        .main-card {
            width: 100%;
            max-width: 1000px; /* Ширина карточки */
            background: rgba(18, 7, 11, 0.85); /* Полупрозрачный бордовый фон */
            border: 1px solid rgba(255, 59, 86, 0.35); /* Красная рамка */
            border-radius: 20px;
            backdrop-filter: blur(16px); /* Эффект матового стекла */
            padding: 45px;
            opacity: 0;
            transform: translateY(60px);
            transition: all 1s ease-out; /* Плавность выплывания */
        }

        /* Класс, который добавляется через JS при скролле */
        .main-card.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        /* Сетка: Вьюпорт слева, Характеристики справа */
        .grid-main {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            margin-top: 30px;
        }

        /* Контейнер для 3D просмотра */
        .viewport {
            height: 450px;
            background: #000;
            border-radius: 12px;
            border: 1px solid rgba(255, 59, 86, 0.2);
            overflow: hidden;
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        /* Панель со статикой */
        .stats {
            background: rgba(0, 0, 0, 0.4);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-line {
            padding: 12px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        /* ==========================================================================
           06. ГАЛЕРЕЯ ДРУГИХ РАБОТ (GALLERY GRID)
           ========================================================================== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); /* Авто-сетка */
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .work-card {
            background: rgba(18, 7, 11, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
            cursor: pointer;
            opacity: 0;
            transform: translateY(40px);
        }

        .work-card.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        /* Ховер-эффект при наведении на карточку */
        .work-card:hover {
            border-color: #ff3b56;
            box-shadow: 0 0 20px rgba(255, 59, 86, 0.2);
            transform: translateY(-5px);
        }

        .preview-img {
            width: 100%;
            height: 200px;
            background: #111;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* ==========================================================================
           07. АДАПТИВНОСТЬ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ (MOBILE RESPONSIVE)
           ========================================================================== */
        @media (max-width: 850px) {
            .grid-main {
                grid-template-columns: 1fr; /* Перевод сетки в 1 колонку */
            }
            .viewport {
                height: 300px; /* Уменьшение высоты 3D на телефонах */
            }
        }
    </style>
</head>
<body>

    <!-- Элементы фона -->
    <div id="bg-image"></div>
    <div class="bg-overlay"></div>

    <div class="page-content">
        
        <!-- ПЕРВЫЙ ЭКРАН -->
        <header class="hero">
            <!-- Анимированная лента -->
            <div class="ribbon-container">
                <div class="ribbon-track">
                    <span class="ribbon-jp">伝説</span>
                    <span class="ribbon-name">Gastero4ek</span>
                </div>
            </div>

            <!-- Главный заголовок -->
            <h1 class="site-logo">PORTFOLIO</h1>
            <div class="site-subtitle">3D Artist</div>
        </header>

        <!-- ГЛАВНАЯ РАБОТА С 3D ПЛЕЕРОМ -->
        <section class="section">
            <div class="main-card js-reveal">
                <h2 style="font-family: 'Cinzel', serif; font-size: 32px; margin: 0;">Featured: Guts Sword</h2>
                
                <div class="grid-main">
                    <!-- 3D-Вьюпорт -->
                    <div class="viewport">
                        <!-- 
                            src="model.glb" -> имя твоего 3D файла в папке проекта.
                            camera-controls -> позволяет крутить модель мышкой.
                            auto-rotate -> включить авто-вращение.
                        -->
                        <model-viewer 
                            src="model.glb" 
                            camera-controls 
                            auto-rotate 
                            shadow-intensity="1.5">
                        </model-viewer>
                    </div>

                    <!-- Правый блок со статистикой -->
                    <div class="stats">
                        <div class="stat-line">
                            <div class="stat-label">Model Type</div>
                            <div class="stat-val">Hard Surface Asset</div>
                        </div>
                        <div class="stat-line">
                            <div class="stat-label">Polycount</div>
                            <div class="stat-val" style="color:#ff3b56">18,450 Tris</div>
                        </div>
                        <div class="stat-line">
                            <div class="stat-label">Textures</div>
                            <div class="stat-val">4K PBR Materials</div>
                        </div>
                        <div class="stat-line">
                            <div class="stat-label">Software</div>
                            <div class="stat-val">Blender / ZBrush</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ГАЛЕРЕЯ ДРУГИХ РАБОТ -->
        <h2 style="text-align: center; font-family: 'Cinzel'; color: #ff3b56; font-size: 28px; letter-spacing: 5px;">OTHER WORKS</h2>
        
        <div class="gallery-grid">
            <div class="work-card js-reveal">
                <div class="preview-img"></div>
                <h3>Sci-Fi Prop</h3>
                <p>Environmental Asset</p>
            </div>
            <div class="work-card js-reveal">
                <div class="preview-img"></div>
                <h3>Mech Robot</h3>
                <p>Character Study</p>
            </div>
            <div class="work-card js-reveal">
                <div class="preview-img"></div>
                <h3>Dungeon Scene</h3>
                <p>UE5 Environment</p>
            </div>
        </div>

    </div>

    <!-- ==========================================================================
       08. JAVASCRIPT ЛОГИКА (АНИМАЦИИ И ИНТЕРАКТИВ)
       ========================================================================== -->
    <script>
        // 1. ДВИЖЕНИЕ ФОНА ЗА КУРСОРОМ МЫШИ (Parallax Effect)
        const bg = document.getElementById("bg-image");
        window.addEventListener("mousemove", (e) => {
            const x = (e.clientX / window.innerWidth) - 0.5;
            const y = (e.clientY / window.innerHeight) - 0.5;
            // Смещаем фон на 30px по оси X и Y
            bg.style.transform = `translate(${x * 30}px, ${y * 30}px) scale(1.05)`;
        });

        // 2. АНИМАЦИЯ ПОЯВЛЕНИЯ БЛОКОВ ПРИ СКРОЛЛЕ (Intersection Observer)
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                // Если элемент появился в зоне видимости хотя бы на 10%
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal'); // Добавляем CSS-класс анимации
                }
            });
        }, { threshold: 0.1 });

        // Отслеживаем все элементы с классом .js-reveal
        document.querySelectorAll('.js-reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
